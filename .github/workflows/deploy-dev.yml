name: Deploy development

on:
  push:
    branches: [dev]

concurrency:
  group: route-optimization-development
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy development
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Cloud Run service
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_DEV_PROJECT_ID }}
        run: >-
          gcloud run deploy route-optimization-dev
          --project "$GCP_PROJECT_ID"
          --region asia-south1
          --source .
          --no-allow-unauthenticated
          --timeout 300
          --update-env-vars BQ_PROJECT="$GCP_PROJECT_ID",FIRESTORE_PROJECT="$GCP_PROJECT_ID",BQ_DATASET=Hermes_Exports,BQ_TABLE=consignments_routing,BQ_STRUCTURED_TABLE=consignments_structured
          --set-secrets GOOGLE_MAPS_API_KEY=google-maps-api-key:latest