name: Deploy development

on:
  push:
    branches: [dev]

concurrency:
  group: route-optimization-development
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to hermes-dev-508805
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy Cloud Run service
        run: >-
          gcloud run deploy route-optimization-dev
          --project hermes-dev-508805
          --region asia-south1
          --source .
          --no-allow-unauthenticated
          --timeout 300
          --update-env-vars BQ_PROJECT=hermes-dev-508805,FIRESTORE_PROJECT=hermes-dev-508805
          --set-secrets GOOGLE_MAPS_API_KEY=google-maps-api-key:latest
